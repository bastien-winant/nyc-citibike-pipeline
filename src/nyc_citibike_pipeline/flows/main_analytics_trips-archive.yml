id: trips-archive
namespace: analytics

inputs:
  - id: blobs
    type: ARRAY
    itemType: JSON


tasks:
  - id: foreach_copy
    type: io.kestra.plugin.core.flow.Loop
    values: "{{ inputs.blobs }}"
    concurrencyLimit: 10
    tasks:
      - id: copy_to_archive
        type: io.kestra.plugin.gcp.gcs.Copy
        serviceAccount: "{{secret('GCP_CREDS')}}"
        projectId: "{{kv('GCP_PROJECT_ID')}}"
        from: "{{ item.value | jq('.uri') | first }}"
        to: "gs://{{kv('GCP_BUCKET_NAME')}}/citibike-trips-archive/{{ item.value | jq('.name') | first | split(\"/\") | last }}"
        runIf: "{{ item.value | jq('.size') | first > 0 }}"
        delete: true