id: trips-ingest
namespace: analytics

variables:
  # file_id: "{{ trigger.date  | dateAdd(-3, 'MONTHS') | date('yyyyMM') }}"
  file_id: "{{ execution.startDate | dateAdd(-3, 'MONTHS') | date('yyyyMM') }}"
  gcs_file: "gs://{{kv('GCP_BUCKET_NAME')}}/{{vars.file_id}}"

tasks:
  - id: get_zip_file
    type: io.kestra.plugin.core.http.Download
    uri: https://s3.amazonaws.com/tripdata/202402-citibike-tripdata.zip

  - id: unzip
    type: io.kestra.plugin.compress.ArchiveDecompress
    algorithm: ZIP
    from: "{{ outputs.get_zip_file.uri }}"

  - id: parallel_upload_to_gcs
    type: io.kestra.plugin.core.flow.ForEach
    values: "{{ outputs.unzip.files | values }}"
    concurrencyLimit: 5
    tasks:
      - id: csv_to_ion
        type: io.kestra.plugin.serdes.csv.CsvToIon
        from: "{{ taskrun.value }}"
        header: true

      - id: ion_to_avro
        type: io.kestra.plugin.serdes.avro.IonToAvro
        from: "{{ outputs.csv_to_ion[taskrun.value].uri }}"
        datetimeFormat: "yyyy-MM-dd' 'HH:mm:ss"
        schema: |
          {
            "type": "record",
            "name": "Ride",
            "namespace": "com.example.ride",
            "fields": [
              {"name": "ride_id", "type": "string"},
              {"name": "rideable_type", "type": "string"},
              {"name": "started_at", "type": "string", "logicalType": "local-timestamp-millis"},
              {"name": "ended_at", "type": "string", "logicalType": "local-timestamp-millis"},
              {"name": "start_station_name", "type": "string"},
              {"name": "start_station_id", "type": "string"},
              {"name": "end_station_name", "type": "string"},
              {"name": "end_station_id", "type": "string"},
              {"name": "start_lat", "type": "string"},
              {"name": "start_lng", "type": "string"},
              {"name": "end_lat", "type": "string"},
              {"name": "end_lng", "type": "string"},
              {"name": "member_casual", "type": "string"}
            ]
          }

      - id: upload_to_gcs
        type: io.kestra.plugin.gcp.gcs.Upload
        from: "{{ outputs.ion_to_avro[taskrun.value].uri }}"
        to: "gs://{{kv('GCP_BUCKET_NAME')}}/{{vars.file_id}}-{{ taskrun.id }}.avro"


  # ---------------------------------------------------------
  # 1. LIST INPUT FILES
  # ---------------------------------------------------------
  - id: list_files
    type: io.kestra.plugin.gcp.gcs.List
    from: "gs://{{kv('GCP_BUCKET_NAME')}}/"


  # ---------------------------------------------------------
  # 2. PARALLEL GCS -> BIGQUERY RAW INGESTION
  # ---------------------------------------------------------
  - id: foreach_file
    type: io.kestra.plugin.core.flow.ForEach
    values: "{{ outputs.list_files.blobs }}"
    concurrencyLimit: 5
    tasks:
      - id: print_raw
        type: io.kestra.plugin.core.log.Log
        message: "Ingesting file: {{ taskrun.value | jq('.uri') | first }}"

      - id: load_raw
        type: io.kestra.plugin.gcp.bigquery.LoadFromGcs
        from:
          - "{{ taskrun.value | jq('.uri') | first }}"
        destinationTable: "{{kv('GCP_PROJECT_ID')}}.{{kv('GCP_RAW_DATASET')}}.raw_trips"
        format: AVRO
        location: "{{kv('GCP_PROJECT_REGION')}}"
        writeDisposition: WRITE_APPEND
        runIf: "{{ taskrun.value | jq('.size') | first > 0 }}"

  - id: purge_files
    type: io.kestra.plugin.core.storage.PurgeCurrentExecutionFiles
    description: To avoid cluttering your storage, we will remove the downloaded files

pluginDefaults:
  - type: io.kestra.plugin.gcp
    values:
      serviceAccount: "{{kv('GCP_CREDS')}}"
      projectId: "{{kv('GCP_PROJECT_ID')}}"
      location: "{{kv('GCP_LOCATION')}}"
      bucket: "{{kv('GCP_BUCKET_NAME')}}"