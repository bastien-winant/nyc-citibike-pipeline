id: trips-transform
namespace: analytics

inputs:
  - id: execution_timestamp
    type: STRING

  - id: gcs_file
    type: STRING

tasks:
  - id: stg_trips_create
    type: io.kestra.plugin.gcp.bigquery.Query
    serviceAccount: "{{secret('GCP_CREDS')}}"
    projectId: "{{kv('GCP_PROJECT_ID')}}"
    location: "{{kv('GCP_LOCATION')}}"
    sql: |
      CREATE TABLE IF NOT EXISTS `{{kv('GCP_PROJECT_ID')}}.{{kv('GCP_STG_DATASET')}}.trips`
      (
          ride_id STRING OPTIONS (description="Unique identifier for the ride"),
          rideable_type STRING OPTIONS (description="Type of bike used for the ride"),      
          started_at DATETIME OPTIONS (description="Timestamp when the ride was started"),
          ended_at DATETIME OPTIONS (description="Timestamp when the ride was ended"),
          start_station_id STRING OPTIONS (description="Unique identifier for the start station"),
          start_station_name STRING OPTIONS (description="Name of the station where the ride started"),
          end_station_id STRING OPTIONS (description="Unique identifier for the end station"),
          end_station_name STRING OPTIONS (description="Name of the station where the ride ended"),
          start_lat NUMERIC OPTIONS (description="Latitude of the start location"),
          start_lng NUMERIC OPTIONS (description="Longitude of the start location"),
          end_lat NUMERIC OPTIONS (description="Latitude of the end location"),
          end_lng NUMERIC OPTIONS (description="Longitude of the end location"),
          member_casual STRING OPTIONS (description="Type of member (casual or member)"),
          filename STRING OPTIONS (description="Name of the raw data file"),
          uploaded_at DATETIME OPTIONS (description="Date and time of last record update"),
      )
      PARTITION BY DATE(started_at);

  - id: raw_trips_table_ext
    type: io.kestra.plugin.gcp.bigquery.Query
    serviceAccount: "{{secret('GCP_CREDS')}}"
    projectId: "{{kv('GCP_PROJECT_ID')}}"
    location: "{{kv('GCP_LOCATION')}}"
    sql: |
      CREATE OR REPLACE EXTERNAL TABLE `{{kv('GCP_PROJECT_ID')}}.{{kv('GCP_RAW_DATASET')}}.trips_ext`
      (
        ride_id STRING OPTIONS (description="Unique identifier for the ride"),
        rideable_type STRING OPTIONS (description="Type of bike used for the ride"),
        started_at STRING OPTIONS (description="Timestamp when the ride was started"),
        ended_at STRING OPTIONS (description="Timestamp when the ride was ended"),
        start_station_id STRING OPTIONS (description="Unique identifier for the start station"),
        start_station_name STRING OPTIONS (description="Name of the station where the ride started"),
        end_station_id STRING OPTIONS (description="Unique identifier for the end station"),
        end_station_name STRING OPTIONS (description="Name of the station where the ride ended"),
        start_lat STRING OPTIONS (description="Latitude of the start location"),
        start_lng STRING OPTIONS (description="Longitude of the start location"),
        end_lat STRING OPTIONS (description="Latitude of the end location"),
        end_lng STRING OPTIONS (description="Longitude of the end location"),
        member_casual STRING OPTIONS (description="Type of member (casual or member)")
      )
      OPTIONS (
          format = 'AVRO',
          uris = ['{{inputs.gcs_file}}-*.avro']
      );

  - id: raw_trips_table
    type: io.kestra.plugin.gcp.bigquery.Query
    serviceAccount: "{{secret('GCP_CREDS')}}"
    projectId: "{{kv('GCP_PROJECT_ID')}}"
    location: "{{kv('GCP_LOCATION')}}"
    destinationTable: "{{kv('GCP_PROJECT_ID')}}.{{kv('GCP_RAW_DATASET')}}.trips"
    createDisposition: CREATE_IF_NEEDED
    writeDisposition: WRITE_APPEND
    sql: |
      SELECT
        *,
        "{{inputs.gcs_file}}" AS filename,
        "{{inputs.execution_timestamp}}" AS uploaded_at
      FROM `{{kv('GCP_PROJECT_ID')}}.{{kv('GCP_RAW_DATASET')}}.trips_ext`;
  
  - id: stg_trips_merge
    type: io.kestra.plugin.gcp.bigquery.Query
    serviceAccount: "{{secret('GCP_CREDS')}}"
    projectId: "{{kv('GCP_PROJECT_ID')}}"
    location: "{{kv('GCP_LOCATION')}}"
    sql: |
      MERGE INTO `{{kv('GCP_PROJECT_ID')}}.{{kv('GCP_STG_DATASET')}}.trips` T
      USING (
        SELECT
            ride_id,
            rideable_type,
            SAFE_CAST(started_at AS DATETIME) AS started_at,
            SAFE_CAST(ended_at AS DATETIME) AS ended_at,
            start_station_id,
            start_station_name,
            end_station_id,
            end_station_name,
            SAFE_CAST(start_lat AS NUMERIC) AS start_lat,
            SAFE_CAST(start_lng AS NUMERIC) AS start_lng,
            SAFE_CAST(end_lat AS NUMERIC) AS end_lat,
            SAFE_CAST(end_lng AS NUMERIC) AS end_lng,
            member_casual,
            filename,
            PARSE_DATETIME('%F %T', uploaded_at) AS uploaded_at
        FROM `{{kv('GCP_PROJECT_ID')}}.{{kv('GCP_RAW_DATASET')}}.trips`
        WHERE uploaded_at = "{{inputs.execution_timestamp}}"
        AND filename = "{{inputs.gcs_file}}"
      ) S
      ON T.ride_id = S.ride_id
      WHEN MATCHED THEN
        UPDATE SET
          rideable_type = S.rideable_type,
          started_at = S.started_at,
          ended_at = S.ended_at,
          start_station_id = S.start_station_id,
          start_station_name = S.start_station_name,
          end_station_id = S.end_station_id,
          end_station_name = S.end_station_name,
          start_lat = S.start_lat,
          start_lng = S.start_lng,
          end_lat = S.end_lat,
          end_lng = S.end_lng,
          member_casual = S.member_casual,
          filename = S.filename,
          uploaded_at = S.uploaded_at
      WHEN NOT MATCHED THEN
        INSERT (ride_id, rideable_type, started_at, ended_at, start_station_id, start_station_name, end_station_id, end_station_name, start_lat, start_lng, end_lat, end_lng, member_casual, filename, uploaded_at)
        VALUES (S.ride_id, S.rideable_type, S.started_at, S.ended_at, S.start_station_id, S.start_station_name, S.end_station_id, S.end_station_name, S.start_lat, S.start_lng, S.end_lat, S.end_lng, S.member_casual, S.filename, S.uploaded_at);

  - id: purge_files
    type: io.kestra.plugin.core.storage.PurgeCurrentExecutionFiles
    description: To avoid cluttering your storage, we will remove the downloaded files