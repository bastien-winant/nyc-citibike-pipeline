id: trips-elt
namespace: analytics

variables:
  # file_id: "{{ trigger.date  | dateAdd(-3, 'MONTHS') | date('yyyyMM') }}"
  # file_id: "{{ execution.startDate | dateAdd(-3, 'MONTHS') | date('yyyyMM') }}"
  file_id: "202404"

tasks:

  # ---------------------------------------------------------
  # 0. TRIGGER SUBFLOW (Set GCP Key-Values)
  # ---------------------------------------------------------
  - id: set_gcp_kv
    type: io.kestra.plugin.core.flow.Subflow
    namespace: analytics
    flowId: gcp-kv
    wait: true
  
  # ---------------------------------------------------------
  # 1. TRIGGER SUBFLOW (Data ingestion)
  # ---------------------------------------------------------
  - id: extract_data
    type: io.kestra.plugin.core.flow.Subflow
    namespace: analytics
    flowId: trips-extract
    inputs:
      zip_uri: "https://s3.amazonaws.com/tripdata/{{vars.file_id}}-citibike-tripdata.zip"
      gcs_path: "gs://{{kv('GCP_BUCKET_NAME')}}/{{vars.file_id}}"
    wait: true

  # ---------------------------------------------------------
  # 2. LIST INPUT FILES
  # ---------------------------------------------------------
  - id: list_files
    type: io.kestra.plugin.gcp.gcs.List
    from: "gs://{{kv('GCP_BUCKET_NAME')}}"
    serviceAccount: "{{secret('GCP_CREDS')}}"
    projectId: "{{kv('GCP_PROJECT_ID')}}"


  # -------------------------------------------------------------------------------
  # 3. TRIGGER SUBFLOW (Parallel GCS -> BigQuery raw ingestion and cleaning)
  # -------------------------------------------------------------------------------
  - id: load_data
    type: io.kestra.plugin.core.flow.Subflow
    namespace: analytics
    flowId: trips-load
    inputs:
      execution_timestamp: "{{ execution.startDate | date('yyyy-MM-dd HH:mm:ss') }}"
      gcs_file: "gs://{{kv('GCP_BUCKET_NAME')}}/{{vars.file_id}}"
    wait: true


  # ---------------------------------------------------------
  # 4. TRIGGER SUBFLOW (BigQuery transformations)
  # ---------------------------------------------------------
  - id: transform_data
    type: io.kestra.plugin.core.flow.Subflow
    namespace: analytics
    flowId: trips-transform
    wait: true
  
  # ---------------------------------------------------------
  # 5. COPY EACH FILE TO ARCHIVE (per-file)
  # ---------------------------------------------------------
  - id: archive_raw_data
    type: io.kestra.plugin.core.flow.Subflow
    namespace: analytics
    flowId: trips-archive
    inputs:
      blobs: "{{ outputs.list_files.blobs }}"
    wait: true


  - id: purge_files
    type: io.kestra.plugin.core.storage.PurgeCurrentExecutionFiles
    description: To avoid cluttering your storage, we will remove the downloaded files