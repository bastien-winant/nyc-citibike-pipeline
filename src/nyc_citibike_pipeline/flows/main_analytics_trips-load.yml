id: trips-load
namespace: analytics

inputs:
  - id: blobs
    type: ARRAY
    itemType: JSON
    required: false

tasks:
  - id: foreach_file
    type: io.kestra.plugin.core.flow.Loop
    values: "{{ inputs.blobs }}"
    concurrencyLimit: 5
    tasks:
      - id: load_raw
        type: io.kestra.plugin.gcp.bigquery.LoadFromGcs
        from:
          - "{{ item.value | jq('.uri') | first }}"
        destinationTable: "{{kv('GCP_PROJECT_ID')}}.{{kv('GCP_RAW_DATASET')}}.trips"
        format: AVRO
        avroOptions:
          useAvroLogicalTypes: true
        location: "{{kv('GCP_PROJECT_REGION')}}"
        writeDisposition: WRITE_APPEND
        runIf: "{{ item.value | jq('.size') | first > 0 }}"


pluginDefaults:
  - type: io.kestra.plugin.gcp
    values:
      serviceAccount: "{{secret('GCP_CREDS')}}"
      projectId: "{{kv('GCP_PROJECT_ID')}}"
      location: "{{kv('GCP_LOCATION')}}"
      bucket: "{{kv('GCP_BUCKET_NAME')}}"