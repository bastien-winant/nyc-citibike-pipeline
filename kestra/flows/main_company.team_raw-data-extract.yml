id: raw-data-extract
namespace: company.team
description: Request and unzip a zip file from a given URI

inputs:
  - id: http_uri
    type: STRING
  - id: gcs_path
    type: STRING
  - id: data_month
    type: STRING

tasks:
  - id: get_zip_file
    type: io.kestra.plugin.core.http.Download
    uri: "{{ inputs.http_uri }}"

  - id: unzip
    type: io.kestra.plugin.compress.ArchiveDecompress
    algorithm: ZIP
    from: "{{ outputs.get_zip_file.uri }}"

  - id: foreach_upload
    type: io.kestra.plugin.core.flow.ForEach
    values: "{{ outputs.unzip.files | values }}"
    concurrencyLimit: 5
    tasks:
      - id: gcs_load_raw
        type: io.kestra.plugin.gcp.gcs.Upload
        from: "{{ taskrun.value }}"
        to: "{{ inputs.gcs_path }}/{{ inputs.data_month }}-{{ taskrun.iteration }}.csv"

pluginDefaults:
  - type: io.kestra.plugin.gcp
    values:
      serviceAccount: "{{ secret('GCP_SERVICE_ACCOUNT') }}"
      projectId: "{{ kv('GCP_PROJECT_ID') }}"
      location: "{{ kv('GCP_LOCATION') }}"
      bucket: "{{ kv('GCP_BUCKET_NAME') }}"