id: raw-data-transform
namespace: company.team
description: Process raw data

tasks:
  # ---------------------------------------------------------
  # 1. SPECIAL TRIP DETECTION (PARALLEL)
  # ---------------------------------------------------------
  - id: classify_trips
    type: io.kestra.plugin.core.flow.Parallel
    tasks:
      - id: clean_data
        type: io.kestra.plugin.gcp.bigquery.Query
        sql: |
          CREATE OR REPLACE TABLE `{{ kv('GCP_PROJECT_ID' ) }}.{{ kv('GCP_DATASET_STG') }}.trips_stg` AS
          SELECT
            ride_id,
            rideable_type,
            started_at AS start_datetime,
            ended_at AS end_datetime,
            RTRIM(start_station_id, '_') AS start_station_id,
            start_station_name,
            start_lat AS start_station_lat,
            start_lng AS start_station_lng,
            RTRIM(end_station_id, '_') AS end_station_id,
            end_station_name,
            end_lat AS end_station_lat,
            end_lng AS end_station_lng,
            member_casual
          FROM `{{ kv('GCP_PROJECT_ID' ) }}.{{ kv('GCP_DATASET_RAW') }}.trips_raw`
          WHERE
            start_station_id IS NOT NULL
            AND end_station_id IS NOT NULL
            AND TIMESTAMP_TRUNC(started_at, MONTH) =
                  TIMESTAMP_TRUNC(TIMESTAMP('{{ execution.startDate | dateAdd(-1, 'MONTHS') }}'), MONTH)
            AND started_at <= ended_at;

      - id: suspicious_trips
        type: io.kestra.plugin.gcp.bigquery.Query
        sql: |
          CREATE OR REPLACE TABLE `{{ kv('GCP_PROJECT_ID' ) }}.{{ kv('GCP_DATASET_STG') }}.timestamp_errors` AS
          SELECT *
          FROM `{{ kv('GCP_PROJECT_ID' ) }}.{{ kv('GCP_DATASET_RAW') }}.trips_raw`
          WHERE NOT (
            TIMESTAMP_TRUNC(started_at, MONTH) =
              TIMESTAMP_TRUNC(TIMESTAMP('{{ execution.startDate | dateAdd(-1, 'MONTHS') }}'), MONTH)
            AND started_at <= ended_at
          );

      - id: invalid_gps
        type: io.kestra.plugin.gcp.bigquery.Query
        sql: |
          CREATE OR REPLACE TABLE `{{ kv('GCP_PROJECT_ID' ) }}.{{ kv('GCP_DATASET_STG') }}.invalid_gps` AS
          SELECT *
          FROM `{{ kv('GCP_PROJECT_ID' ) }}.{{ kv('GCP_DATASET_RAW') }}.trips_raw`
          WHERE NOT (
            start_station_id IS NOT NULL
            AND end_station_id IS NOT NULL
          );

  # ---------------------------------------------------------
  # 2. AGGREGATIONS (PARALLEL)
  # ---------------------------------------------------------
  - id: aggregations
    type: io.kestra.plugin.core.flow.Parallel
    tasks:
      - id: trips_per_station
        type: io.kestra.plugin.gcp.bigquery.Query
        sql: | 
          CREATE OR REPLACE TABLE `{{ kv('GCP_PROJECT_ID' ) }}.{{ kv('GCP_DATASET_CORE') }}.trips_per_station` AS
          SELECT
            start_station_id AS station_id,
            start_station_name AS station_name,
            COUNT(*) as trip_count
          FROM `{{ kv('GCP_PROJECT_ID' ) }}.{{ kv('GCP_DATASET_STG') }}.trips_stg`
          GROUP BY station_id, station_name;

      - id: trips_by_hour
        type: io.kestra.plugin.gcp.bigquery.Query
        sql: |
          CREATE OR REPLACE TABLE `{{ kv('GCP_PROJECT_ID' ) }}.{{ kv('GCP_DATASET_CORE') }}.trips_by_hour` AS
          SELECT
            EXTRACT(HOUR FROM start_datetime) AS hour,
            COUNT(*) AS trip_count
          FROM `{{ kv('GCP_PROJECT_ID' ) }}.{{ kv('GCP_DATASET_STG') }}.trips_stg`
          GROUP BY hour;

pluginDefaults:
  - type: io.kestra.plugin.gcp
    values:
      serviceAccount: "{{ secret('GCP_SERVICE_ACCOUNT') }}"
      projectId: "{{ kv('GCP_PROJECT_ID') }}"
      location: "{{ kv('GCP_LOCATION') }}"
      bucket: "{{ kv('GCP_BUCKET_NAME') }}"