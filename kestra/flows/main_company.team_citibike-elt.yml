id: citibike-elt
namespace: company.team
description: Extract, Transform and Load Citibike rides data

variables:
  data_month: "{{ trigger.date ?? execution.startDate | dateAdd(-1, 'MONTHS') | date('yyyyMM') }}"
  file_uri: "https://s3.amazonaws.com/tripdata/{{ vars.data_month }}-citibike-tripdata.zip"
  gcs_path: "gs://{{ kv('GCP_BUCKET_NAME') }}/{{ trigger.date ?? execution.startDate | dateAdd(-1, 'MONTHS') | date('yyyy-MM') }}"

tasks:
  # ---------------------------------------------------------
  # 0. GCP KV SETUP
  # ---------------------------------------------------------
  - id: gcp_kv_setup
    type: io.kestra.plugin.core.flow.Subflow
    namespace: company.team
    flowId: gcp-kv
    wait: true
    transmitFailed: true

  # ---------------------------------------------------------
  # 1. EXTRACT AND LOAD RAW FILES TO GCS
  # ---------------------------------------------------------
  - id: extract_raw
    type: io.kestra.plugin.core.flow.Subflow
    namespace: company.team
    flowId: raw-data-extract
    inputs:
      http_uri: "{{ render(vars.file_uri) }}"
      gcs_path: "{{ render(vars.gcs_path) }}"
      data_month: "{{ render(vars.data_month) }}"
    wait: true
    transmitFailed: true

  # ---------------------------------------------------------
  # 2. GCS -> BIGQUERY RAW INGESTION
  # ---------------------------------------------------------
  - id: bq_load_raw
    type: io.kestra.plugin.gcp.bigquery.LoadFromGcs
    from:
      - "{{ render(vars.gcs_path) }}/{{ render(vars.data_month) }}-*.csv"
    destinationTable: "{{ kv('GCP_PROJECT_ID' ) }}.{{ kv('GCP_DATASET_RAW') }}.trips_raw"
    format: CSV
    autodetect: true
    csvOptions:
      skipLeadingRows: 1
    writeDisposition: WRITE_TRUNCATE
    schema:
      fields:
        - name: ride_id
          type: STRING
        - name: rideable_type
          type: STRING
        - name: started_at
          type: TIMESTAMP
        - name: ended_at
          type: TIMESTAMP
        - name: start_station_name
          type: STRING
        - name: start_station_id
          type: STRING
        - name: end_station_name
          type: STRING
        - name: end_station_id
          type: STRING
        - name: start_lat
          type: FLOAT64
        - name: start_lng
          type: FLOAT64
        - name: end_lat
          type: FLOAT64
        - name: end_lng
          type: FLOAT64
        - name: member_casual
          type: STRING

  # ---------------------------------------------------------
  # 3. BIGQUERY DATA TRANSFORMATIONS
  # ---------------------------------------------------------
  - id: transform_raw
    type: io.kestra.plugin.core.flow.Subflow
    namespace: company.team
    flowId: raw-data-transform
    wait: true
    transmitFailed: true

  - id: purge_files
    type: io.kestra.plugin.core.storage.PurgeCurrentExecutionFiles
    description: To avoid cluttering your storage, we will remove the downloaded files

pluginDefaults:
  - type: io.kestra.plugin.gcp
    values:
      serviceAccount: "{{ secret('GCP_SERVICE_ACCOUNT') }}"
      projectId: "{{ kv('GCP_PROJECT_ID') }}"
      location: "{{ kv('GCP_LOCATION') }}"
      bucket: "{{ kv('GCP_BUCKET_NAME') }}"