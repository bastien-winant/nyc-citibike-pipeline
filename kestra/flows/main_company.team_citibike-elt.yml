id: citibike-elt
namespace: company.team
description: Extract, Transform and Load Citibike rides data

variables:
  data_month: "{{ execution.startDate | dateAdd(-1, 'MONTHS') | date('yyyyMM') }}"
  file_uri: "https://s3.amazonaws.com/tripdata/{{ execution.startDate | dateAdd(-1, 'MONTHS') | date('yyyyMM') }}-citibike-tripdata.zip"
  gcs_path: "gs://{{ kv('GCP_BUCKET_NAME') }}/{{ execution.startDate | dateAdd(-1, 'MONTHS') | date('yyyy-MM') }}"

tasks:
  # --- 0. Set up GCP key-values ---
  - id: gcp_kv_setup
    type: io.kestra.plugin.core.flow.Subflow
    namespace: company.team
    flowId: gcp-kv
    wait: true
    transmitFailed: true

  # --- 1. Fetch RAW data files from source system ---
  - id: extract_raw
    type: io.kestra.plugin.core.flow.Subflow
    namespace: company.team
    flowId: raw-data-extract
    inputs:
      http_uri: "{{ render(vars.file_uri) }}"
    wait: true
    transmitFailed: true

  # --- 2. Load RAW data files into the GCS bucket ---
  - id: for_each
    type: io.kestra.plugin.core.flow.ForEach
    values: "{{ outputs.extract_raw.outputs.generated_files | values }}"
    tasks:
      - id: gcs_load_raw
        type: io.kestra.plugin.gcp.gcs.Upload
        from: "{{ taskrun.value }}"
        to: "{{ render(vars.gcs_path) }}/{{ render(vars.data_month) }}-{{ taskrun.iteration }}.csv"

  # --- 3. Load RAW data from GCS into BigQuery
  - id: bq_load_raw
    type: io.kestra.plugin.gcp.bigquery.LoadFromGcs
    from:
      - "{{ render(vars.gcs_path) }}/{{ render(vars.data_month) }}-*.csv"
    destinationTable: "{{ kv('GCP_PROJECT_ID' ) }}.{{ kv('GCP_DATASET_RAW') }}.trips_raw"
    format: CSV
    autodetect: true
    csvOptions:
      skipLeadingRows: 1
    writeDisposition: WRITE_TRUNCATE
    schema:
      fields:
        - name: ride_id
          type: STRING
        - name: rideable_type
          type: STRING
        - name: started_at
          type: TIMESTAMP
        - name: ended_at
          type: TIMESTAMP
        - name: start_station_name
          type: STRING
        - name: start_station_id
          type: STRING
        - name: end_station_name
          type: STRING
        - name: end_station_id
          type: STRING
        - name: start_lat
          type: FLOAT64
        - name: start_lng
          type: FLOAT64
        - name: end_lat
          type: FLOAT64
        - name: end_lng
          type: FLOAT64
        - name: member_casual
          type: STRING

  - id: clean_data
    type: io.kestra.plugin.gcp.bigquery.Query
    sql: |
      CREATE OR REPLACE TABLE `{{ kv('GCP_PROJECT_ID' ) }}.{{ kv('GCP_DATASET_STG') }}.trips_stg` AS
      SELECT
        ride_id,
        rideable_type,
        started_at,
        ended_at,
        RTRIM(start_station_id, '_') AS start_station_id,
        start_station_name,
        start_lat AS start_station_lat,
        start_lng AS start_station_lng,
        RTRIM(end_station_id, '_') AS end_station_id,
        end_station_name,
        end_lat AS end_station_lat,
        end_lng AS end_station_lng,
        member_casual
      FROM `{{ kv('GCP_PROJECT_ID' ) }}.{{ kv('GCP_DATASET_RAW') }}.trips_raw`
      WHERE
        start_station_id IS NOT NULL
        AND end_station_id IS NOT NULL
        AND TIMESTAMP_TRUNC(started_at, MONTH) =
              TIMESTAMP_TRUNC(TIMESTAMP('{{ execution.startDate | dateAdd(-1, 'MONTHS') }}'), MONTH)
        AND started_at <= ended_at

pluginDefaults:
  - type: io.kestra.plugin.gcp
    values:
      serviceAccount: "{{ secret('GCP_SERVICE_ACCOUNT') }}"
      projectId: "{{ kv('GCP_PROJECT_ID') }}"
      location: "{{ kv('GCP_LOCATION') }}"
      bucket: "{{ kv('GCP_BUCKET_NAME') }}"