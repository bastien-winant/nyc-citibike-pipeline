id: upload-retry
namespace: company.team

inputs:
  - id: file_name
    type: STRING
  - id: raw_table
    type: STRING
  - id: execution_run_id
    type: STRING
  - id: ingestion_run_id
    type: STRING

tasks:
  # -------------------------------
  # UPSERT THE STAGING TRIPS TABLE
  # -------------------------------
  - id: upsert
    type: io.kestra.plugin.gcp.bigquery.Query
    sql: |
      MERGE INTO `{{ kv('GCP_PROJECT_ID' ) }}.{{ kv('GCP_DATASET_STG') }}.trips` T
      USING (
        SELECT
          ride_id,
          rideable_type,
          SAFE_CAST(started_at AS TIMESTAMP) AS start_timestamp,
          SAFE_CAST(ended_at AS TIMESTAMP) AS end_timestamp,
          RTRIM(start_station_id, '_') AS start_station_id,
          start_station_name,
          SAFE_CAST(start_lat AS FLOAT64) AS start_station_lat,
          SAFE_CAST(start_lng AS FLOAT64) AS start_station_lng,
          RTRIM(end_station_id, '_') AS end_station_id,
          end_station_name,
          SAFE_CAST(end_lat AS FLOAT64) AS end_station_lat,
          SAFE_CAST(end_lng AS FLOAT64) AS end_station_lng,
          member_casual,
          '{{ inputs.file_name }}' AS source_file,
          '{{ inputs.execution_run_id }}' AS execution_run_id,
          '{{ inputs.ingestion_run_id }}' AS ingestion_run_id,
          CURRENT_TIMESTAMP() AS ingested_at
        FROM `{{ inputs.raw_table }}`
        WHERE start_station_id IS NOT NULL
        AND end_station_id IS NOT NULL
        AND started_at < ended_at
      ) S
      ON T.ride_id = S.ride_id
      WHEN MATCHED THEN
        UPDATE SET
          T.rideable_type = S.rideable_type,
          T.start_timestamp = S.start_timestamp,
          T.end_timestamp = S.end_timestamp,
          T.start_station_id = S.start_station_id,
          T.start_station_name = S.start_station_name,
          T.start_station_lat = S.start_station_lat,
          T.start_station_lng = S.start_station_lng,
          T.end_station_id = S.end_station_id,
          T.end_station_name = S.end_station_name,
          T.end_station_lat = S.end_station_lat,
          T.end_station_lng = S.end_station_lng,
          T.member_casual = S.member_casual,
          T.source_file = S.source_file,
          T.execution_run_id = S.execution_run_id,
          T.ingestion_run_id = S.ingestion_run_id,
          T.ingested_at = S.ingested_at
      WHEN NOT MATCHED THEN
        INSERT (ride_id, rideable_type, start_timestamp, end_timestamp, start_station_id, start_station_name,
                start_station_lat, start_station_lng, end_station_id, end_station_name, end_station_lat,
                end_station_lng, member_casual, source_file, execution_run_id, ingestion_run_id, ingested_at)
        VALUES (S.ride_id, S.rideable_type, S.start_timestamp, S.end_timestamp, S.start_station_id,
                S.start_station_name, S.start_station_lat, S.start_station_lng, S.end_station_id, S.end_station_name,
                S.end_station_lat, S.end_station_lng, S.member_casual, S.source_file, S.execution_run_id,
                S.ingestion_run_id, S.ingested_at);

errors:
  - id: upsert_failed_flag
    type: io.kestra.plugin.core.debug.Return
    format: "upsert_failed"

  # -------------------------------
  # FAIL only when soft failed too
  # -------------------------------
  - id: upsert_failed
    type: io.kestra.plugin.core.execution.Fail
    runIf: "{{ outputs.upsert_failed_flag is defined }}"
    errorMessage: "Staging table upsert failed for {{ inputs.file_name }}."
    
pluginDefaults:
  - type: io.kestra.plugin.gcp
    values:
      serviceAccount: "{{ secret('GCP_SERVICE_ACCOUNT') }}"
      projectId: "{{ kv('GCP_PROJECT_ID') }}"
      location: "{{ kv('GCP_LOCATION') }}"